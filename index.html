<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="绘萤者工具箱，清爽的工具箱">
    <link rel="icon" href="./logo.webp" type="image/png">
    <title>绘萤工具箱</title>
    <script src="assets/sidebar.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f2f5; margin: 0; display: flex; height: 100vh; overflow: hidden; }

        .mobile-header {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 60px;
            background: #fff;
            padding: 0 20px;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            z-index: 1000;
        }
        .mobile-brand { font-size: 1.2em; font-weight: bold; color: #2c3e50; }
        .mobile-brand img { height: 24px; vertical-align: middle; margin-right: 8px; }
        .menu-toggle { font-size: 24px; cursor: pointer; background: none; border: none; color: #4a90e2; }

        .sidebar {
            width: 260px;
            background: #fff;
            border-right: 1px solid #e1e4e8;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 5px rgba(0,0,0,0.02);
            transition: transform 0.3s ease;
            z-index: 1001;
        }

        .brand-header {
            padding: 30px 25px;
            border-bottom: 1px solid #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .brand-name-wrap { display: flex; align-items: center; gap: 10px; }
        .brand-icon { width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0; }
        .brand-name { font-size: 1.25em; font-weight: 700; color: #2c3e50; letter-spacing: 1px; }
        .close-sidebar { display: none; background: none; border: none; font-size: 24px; color: #909399; cursor: pointer; }

        .category-list { padding: 20px 0; flex: 1; }
        .category-item {
            display: block;
            padding: 15px 25px;
            color: #606266;
            text-decoration: none;
            transition: all 0.3s;
            border-left: 4px solid transparent;
            font-weight: 500;
        }
        .category-item:hover, .category-item.active {
            background: #ebf5ff;
            color: #4a90e2;
            border-left-color: #4a90e2;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .main-scroll {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            min-height: 0;
            -webkit-overflow-scrolling: touch;
        }

        .search-section { margin-bottom: 35px; }
        .search-box {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            border: 2px solid #e1e4e8;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        .search-box:focus { border-color: #4a90e2; }
        .tool-stats { margin-top: 10px; color: #909399; font-size: 0.9em; }

        .recommend-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        #dynamicTools {
            display: contents;
        }

        /* ========== 扁平卡片样式（左图标 + 右文字） ========== */
        .tool-card {
            background: white;
            border-radius: 8px;
            padding: 16px 18px;
            text-decoration: none;
            color: #333;
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
            border: 1px solid #ebeef5;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .tool-card:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-color: #4a90e2;
        }
        .tool-card.hidden { display: none; }

        /* ========== 全新图标样式：圆形浅色背景 ========== */
        .icon-box {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #f0f5ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4em;
            flex-shrink: 0;
        }

        .card-text {
            flex: 1;
            min-width: 0;
        }

        .card-text h3 {
            margin: 0 0 4px 0;
            font-size: 0.95em;
            color: #303133;
            font-weight: 600;
        }

        .card-text p {
            font-size: 0.8em;
            color: #909399;
            margin: 0;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .no-results {
            display: none;
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #909399;
        }
        .no-results .no-results-icon { font-size: 3em; margin-bottom: 12px; }
        .no-results p { margin: 0; font-size: 0.95em; }

        .footer {
            padding: 18px 40px;
            background: #fff;
            border-top: 1px solid #e1e4e8;
            text-align: center;
            color: #909399;
            font-size: 0.85em;
            flex-shrink: 0;
        }
        .footer a { color: #4a90e2; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }

        @media (max-width: 768px) {
            body { display: block; height: auto; overflow: auto; }
            .main-content { display: block; }
            .mobile-header { display: flex; }
            .sidebar {
                position: fixed;
                left: 0; top: 0; bottom: 0;
                transform: translateX(-100%);
            }
            .sidebar.active { transform: translateX(0); }
            .close-sidebar { display: block; }
            .main-scroll { padding: 80px 20px 20px 20px; }
            .overlay.active { display: block; }
            .brand-header { padding: 20px; }
            .footer { padding: 15px 20px; }
        }
    </style>
    <meta name="keywords" content="绘萤工具箱,在线工具箱,免费在线工具,纯前端处理,数据不上传,网络工具,文本处理,图像工具,编程开发,日常通用,音视频处理,文档处理" />

    <meta property="og:description" content="绘萤者工具箱，清爽的工具箱" />
    <meta property="og:url" content="https://box.lynvortex.top/index.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="绘萤工具箱" />
    <meta property="og:image" content="https://box.lynvortex.top/logo.webp" />

    <meta itemprop="name" content="绘萤工具箱" />

    <script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "绘萤工具箱",
    "url": "https://box.lynvortex.top/",
    "description": "200+免费在线工具，纯前端处理，数据不上传"

    </script>
</head>
<body>

    <main class="main-content">
        <div class="main-scroll">
            <section class="search-section">
                <input
                    type="text"
                    class="search-box"
                    id="searchInput"
                    placeholder="🔎 搜索工具名称或功能描述..."
                    autocomplete="off"
                />
                <div class="tool-stats" id="toolStats">
                    <!-- 动态填充 -->
                </div>
            </section>

            <div class="recommend-grid" id="toolGrid">
                <!-- 动态加载：优先从 API 获取，API 不可用时显示静态内容 -->
                <div id="dynamicTools"></div>

                <div class="no-results" id="noResults">
                    <div class="no-results-icon">🔭</div>
                    <p>没有找到匹配的工具，换个关键词试试？</p>
                </div>
            </div>
        </div>

        <footer class="footer">
            © 2026 绘萤者-Lynvortex · 美梦多彩 理想自由
            <p><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener" style="color:#4a90e2;text-decoration:underline;font-weight:600;">湘ICP备2026031078号-1</a> <a href="https://beian.mps.gov.cn/#/query/webSearch?code=43050302000259" target="_blank" rel="noopener" style="color:#4a90e2;text-decoration:underline;font-weight:600;margin-left:10px;"><img src="https://beian.mps.gov.cn/web/assets/logo01.6189a29f.png" alt="公安备案徽标" style="width:16px;height:16px;vertical-align:middle;margin-right:4px;border:0;">湘公网安备43050302000259号</a></p>

        </footer>
    </main>

    <script src="assets/api-loader.js"></script>
    <script>
        const searchInput = document.getElementById('searchInput');
        const toolStats = document.getElementById('toolStats');
        const noResults = document.getElementById('noResults');
        const dynamicContainer = document.getElementById('dynamicTools');
        let allTools = [];

        // 从 API 加载工具列表（首页展示全部启用工具，统计与搜索保持一致）
        const loadTools = async () => {
            try {
                allTools = await BoxAPI.getTools();
                renderTools(allTools);
            } catch (e) {
                console.error('API 加载失败，使用静态内容');
            }
        };

        const renderTools = (tools) => {
            let html = tools.map(t => BoxAPI.renderToolCard(t)).join('');
            html += `<a href="#" class="tool-card placeholder-card" style="opacity:0.5;">
                <div class="icon-box" style="background:#f0f0f0;">➕</div>
                <div class="card-text"><h3>更多工具</h3><p>更多工具正在开发中...</p></div>
            </a>`;
            dynamicContainer.innerHTML = html;
            bindSearch();
        };

        const bindSearch = () => {
            const cards = document.querySelectorAll('#dynamicTools .tool-card:not(.placeholder-card)');
            const total = cards.length;
            toolStats.innerHTML = `共 <strong style="color: #4a90e2;">${total}</strong> 个实用工具`;

            searchInput.addEventListener('input', () => {
                const query = searchInput.value.trim().toLowerCase();
                let visible = 0;
                cards.forEach(card => {
                    const title = card.querySelector('h3')?.textContent.toLowerCase() || '';
                    const desc = card.querySelector('p')?.textContent.toLowerCase() || '';
                    const match = !query || title.includes(query) || desc.includes(query);
                    card.classList.toggle('hidden', !match);
                    if (match) visible++;
                });
                const ph = document.querySelector('.placeholder-card');
                if (ph) ph.classList.toggle('hidden', !!query);
                noResults.style.display = visible === 0 ? 'block' : 'none';
                toolStats.innerHTML = query
                    ? `找到 <strong style="color: #4a90e2;">${visible}</strong> / ${total} 个工具`
                    : `共 <strong style="color: #4a90e2;">${total}</strong> 个实用工具`;
            });
        };

        // 页面加载后从 API 拉取工具
        loadTools();
        initSidebar('home');
    </script>
</body>
</html>
