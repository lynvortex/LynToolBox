        .close-sidebar { display: none; background: none; border: none; font-size: 22px; color: #909399; cursor: pointer; }

        .category-list { padding: 16px 0; flex: 1; }
        .category-item { display: block; padding: 14px 22px; color: #606266; text-decoration: none; transition: all 0.2s; border-left: 4px solid transparent; font-weight: 500; font-size: 0.95em; }
        .category-item:hover, .category-item.active { background: #e6faf4; color: #4ae2b7; border-left-color: #4ae2b7; }

        .main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; }

        .main-scroll {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            min-height: 0;
            -webkit-overflow-scrolling: touch;
        }

        .section-desc {
            color: #909399;
            margin-bottom: 30px;
        }

        .search-section { margin-bottom: 35px; }
        .search-box {
            width: 100%;

            border: 2px solid #e1e4e8;
            border-radius: 8px;

            outline: none;

        .tool-stats { margin-top: 10px; color: #909399; font-size: 0.9em; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        #dynamicTools {
            display: contents;
        }

        /* 扁平卡片：左图标 + 右文字 */
        .tool-card {
            background: white;
            border-radius: 8px;
            padding: 16px 18px;
            text-decoration: none;
            color: #333;
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
            border: 1px solid #ebeef5;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .tool-card:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-color: #4ae2b7;
        }
        .tool-card.hidden { display: none; }

        .icon-box {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #f5f0fc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4em;
            flex-shrink: 0;
        }

        .card-text {
            flex: 1;
            min-width: 0;
        }

        .card-text h3 {
            margin: 0 0 4px 0;
            font-size: 0.95em;
            color: #303133;
            font-weight: 600;
        }

        .card-text p {
            font-size: 0.8em;
            color: #909399;
            margin: 0;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .no-results {
            display: none;
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #909399;
        }
        .no-results .no-results-icon { font-size: 3em; margin-bottom: 12px; }
        .no-results p { margin: 0; font-size: 0.95em; }

        .footer { margin-top: 28px; padding-top: 16px; border-top: 1px solid #e1e4e8; text-align: center; color: #909399; font-size: 0.82em; }
        .footer a { color: #4ae2b7; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }

        .overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; }

        @media (max-width: 768px) {
            body { display: block; height: auto; overflow: auto; }
            .main-content { display: block; }
            .mobile-header { display: flex; }
            .sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); }
            .sidebar.active { transform: translateX(0); }
            .close-sidebar { display: block; }
            .main-scroll { padding: 80px 20px 20px; }
            .overlay.active { display: block; }

    <script src="assets/api-loader.js"></script>
    <script>
        const searchInput = document.getElementById('searchInput');
        const toolStats = document.getElementById('toolStats');
        const noResults = document.getElementById('noResults');
        const dynamicContainer = document.getElementById('dynamicTools');

        const loadTools = async () => {
            try {
                const tools = await BoxAPI.getTools({ category: 'image' });
                let html = tools.map(t => BoxAPI.renderToolCard(t)).join('');
                html += `<a href="#" class="tool-card placeholder-card" style="opacity:0.5;">
                    <div class="icon-box" style="background:#f0f0f0;">➕</div>
                    <div class="card-text"><h3>更多工具</h3><p>更多工具正在开发中...</p></div>
                </a>`;
                dynamicContainer.innerHTML = html;
                bindSearch();
            } catch (e) { console.error('API 加载失败', e); }
        };

        const bindSearch = () => {
            const cards = document.querySelectorAll('#dynamicTools .tool-card:not(.placeholder-card)');
            const total = cards.length;
            toolStats.innerHTML = `共 <strong style="color: #4ae2b7;">${total}</strong> 个工具`;

            searchInput.addEventListener('input', () => {
                const query = searchInput.value.trim().toLowerCase();
                let visible = 0;
                cards.forEach(card => {
                    const title = card.querySelector('h3')?.textContent.toLowerCase() || '';
                    const desc = card.querySelector('p')?.textContent.toLowerCase() || '';
                    const match = !query || title.includes(query) || desc.includes(query);
                    card.classList.toggle('hidden', !match);
                    if (match) visible++;
                });
                const ph = document.querySelector('.placeholder-card');
                if (ph) ph.classList.toggle('hidden', !!query);
                noResults.style.display = visible === 0 ? 'block' : 'none';
                toolStats.innerHTML = query
                    ? `找到 <strong style="color: #4ae2b7;">${visible}</strong> / ${total} 个工具`
                    : `共 <strong style="color: #4ae2b7;">${total}</strong> 个工具`;
            });
        };

        loadTools();
        initSidebar('image');
    </script>
