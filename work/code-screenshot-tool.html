<script>
var themes=[{name:'暗夜',bg:'#1e1e1e',fg:'#d4d4d4',kw:'#569cd6',str:'#ce9178',num:'#b5cea8',com:'#6a9955',fn:'#dcdcaa',accent:'#ff6b6b'},{name:'GitHub',bg:'#ffffff',fg:'#24292e',kw:'#d73a49',str:'#032f62',num:'#005cc5',com:'#6a737d',fn:'#6f42c1',accent:'#4a90e2'},{name:'Dracula',bg:'#282a36',fg:'#f8f8f2',kw:'#ff79c6',str:'#f1fa8c',num:'#bd93f9',com:'#6272a4',fn:'#50fa7b',accent:'#ff5555'},{name:'Solarized',bg:'#002b36',fg:'#839496',kw:'#859900',str:'#2aa198',num:'#d33682',com:'#586e75',fn:'#268bd2',accent:'#cb4b16'},{name:'Monokai',bg:'#272822',fg:'#f8f8f2',kw:'#f92672',str:'#e6db74',num:'#ae81ff',com:'#75715e',fn:'#a6e22e',accent:'#fd971f'},{name:'Nord',bg:'#2e3440',fg:'#d8dee9',kw:'#81a1c1',str:'#a3be8c',num:'#b48ead',com:'#616e88',fn:'#88c0d0',accent:'#bf616a'}];
var curTheme=0;
var themeTabs=document.getElementById('themeTabs');
themes.forEach(function(t,i){var d=document.createElement('div');d.className='theme-tab'+(i===0?' active':'');d.style.background=i===0?t.bg:t.bg+'22';d.style.color=i===0?t.fg:t.fg;d.textContent=t.name;d.onclick=function(){document.querySelectorAll('.theme-tab').forEach(function(x){x.classList.remove('active');x.style.background=x.dataset.bg+'22';x.style.color=x.dataset.fg;});d.classList.add('active');d.style.background=t.bg;d.style.color=t.fg;curTheme=i;generate();};d.dataset.bg=t.bg;d.dataset.fg=t.fg;themeTabs.appendChild(d);});
function generate(){var code=document.getElementById('codeInput').value;var lang=document.getElementById('langSelect').value;var theme=themes[curTheme];var bg=document.getElementById('bgColor').value;var lines=code.split('\n');var padding=40,headerH=50,lineH=22;var maxLen=0;lines.forEach(function(l){if(l.length>maxLen)maxLen=l.length;});var charW=9;var codeW=Math.max(400,maxLen*charW+60);var codeH=lines.length*lineH+padding*2+headerH;var totalW=codeW+80;var totalH=codeH+80;var c=document.getElementById('previewCanvas');c.width=totalW;c.height=totalH;var ctx=c.getContext('2d');var grad=ctx.createLinearGradient(0,0,totalW,totalH);grad.addColorStop(0,bg);grad.addColorStop(1,shadeColor(bg,-30));ctx.fillStyle=grad;ctx.fillRect(0,0,totalW,totalH);var rx=40,ry=40,rw=codeW,rh=codeH;ctx.fillStyle=theme.bg;ctx.beginPath();ctx.roundRect(rx,ry,rw,rh,12);ctx.fill();ctx.fillStyle='#ff5f56';ctx.beginPath();ctx.arc(rx+20,ry+20,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffbd2e';ctx.beginPath();ctx.arc(rx+40,ry+20,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#27c93f';ctx.beginPath();ctx.arc(rx+60,ry+20,6,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(rx,ry+headerH-1);ctx.lineTo(rx+rw,ry+headerH-1);ctx.stroke();ctx.font='13px "Courier New",monospace';var keywords={javascript:['function','var','let','const','return','if','else','for','while','class','new','this','import','export','async','await','try','catch'],python:['def','return','if','elif','else','for','while','import','from','class','try','except','with','as','lambda','yield'],html:['<','>','</','/>'],css:['color','background','margin','padding','border','display','position','width','height'],java:['public','private','class','static','void','int','String','return','if','else','new','import','extends','implements'],go:['func','package','import','var','const','type','struct','interface','return','if','else','for','range','go','defer'],sql:['SELECT','FROM','WHERE','INSERT','UPDATE','DELETE','CREATE','TABLE','JOIN','ON','GROUP','ORDER','BY','HAVING','LIMIT']};lines.forEach(function(line,i){var y=ry+headerH+padding+i*lineH;var x=rx+padding;ctx.textBaseline='middle';ctx.fillStyle=theme.com;ctx.font='11px "Courier New",monospace';ctx.fillText(String(i+1).padStart(3,' '),rx+10,y);ctx.font='13px "Courier New",monospace';var tokens=tokenize(line,lang);tokens.forEach(function(tok){ctx.fillStyle=tok.color;ctx.fillText(tok.text,x,y);x+=tok.text.length*charW;});});}
function tokenize(line,lang){var tokens=[];var kw=keywords[lang]||[];var theme=themes[curTheme];if(line.trim().startsWith('//')||line.trim().startsWith('#')){tokens.push({text:line,color:theme.com});return tokens;}var i=0;while(i<line.length){var ch=line[i];if(ch==='"'||ch==="'"||ch==='`'){var end=i+1;while(end<line.length&&line[end]!==ch){if(line[end]==='\\')end++;end++;}tokens.push({text:line.slice(i,end+1),color:theme.str});i=end+1;continue;}if(/[0-9]/.test(ch)){var end=i;while(end<line.length&&/[0-9.]/.test(line[end]))end++;tokens.push({text:line.slice(i,end),color:theme.num});i=end;continue;}if(/[a-zA-Z_$]/.test(ch)){var end=i;while(end<line.length&&/[a-zA-Z0-9_$]/.test(line[end]))end++;var word=line.slice(i,end);var isKw=kw.some(function(k){return k.toLowerCase()===word.toLowerCase();});tokens.push({text:word,color:isKw?theme.kw:theme.fg});i=end;continue;}tokens.push({text:ch,color:theme.fg});i++;}return tokens;}
function shadeColor(hex,percent){var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);r=Math.max(0,Math.min(255,r+percent));g=Math.max(0,Math.min(255,g+percent));b=Math.max(0,Math.min(255,b+percent));return'rgb('+r+','+g+','+b+')';}
document.getElementById('genBtn').onclick=generate;
document.getElementById('downloadBtn').onclick=function(){var c=document.getElementById('previewCanvas');c.toBlob(function(blob){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='code_screenshot.png';a.click();});};
generate();
initSidebar('work');
</script>
