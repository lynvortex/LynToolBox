        .menu-toggle { border: none; background: none; font-size: 24px; cursor: pointer; color: var(--primary); }
        .sidebar { width: 260px; background: #fff; border-right: 1px solid var(--line); display: flex; flex-direction: column; box-shadow: 2px 0 5px rgba(0,0,0,0.02); transition: transform 0.3s ease; z-index: 1001; flex-shrink: 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
        .brand-header { padding: 30px 25px; border-bottom: 1px solid #f0f2f5; display: flex; align-items: center; justify-content: space-between; }
        .brand-name-wrap { display: flex; align-items: center; gap: 10px; }
        .brand-icon { width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0; }
        .brand-name { font-size: 1.25em; font-weight: 700; color: var(--text-main); letter-spacing: 1px; }
        .close-sidebar { display: none; border: none; background: none; font-size: 24px; cursor: pointer; color: var(--text-light); }
        .category-list { padding: 20px 0; flex: 1; }
        .category-item { display: block; padding: 15px 25px; text-decoration: none; color: var(--text-sub); border-left: 4px solid transparent; transition: all 0.3s; font-weight: 500; }
        .category-item:hover, .category-item.active { background: var(--primary-soft); color: var(--primary); border-left-color: var(--primary); }
        .main-content { flex: 1; display: flex; flex-direction: column; min-height: 0; }

        .search-box { width: 100%; max-width: 520px; padding: 12px 20px; border: 2px solid var(--line); border-radius: 8px; font-size: 16px; outline: none; transition: border-color 0.3s; }
        .search-box:focus { border-color: var(--primary); }
        .tool-stats { margin-top: 10px; color: var(--text-light); font-size: 0.9em; }
        .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        #dynamicTools { display: contents; }
        .tool-card { background: #fff; border: 1px solid var(--card-line); border-radius: 8px; padding: 16px 18px; text-decoration: none; color: #333; transition: box-shadow 0.2s ease, border-color 0.2s ease; display: flex; align-items: center; gap: 14px; }
        .tool-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-color: var(--primary); }
        .tool-card.hidden { display: none; }
        .icon-box { width: 42px; height: 42px; border-radius: 50%; background: var(--primary-soft); display: flex; align-items: center; justify-content: center; font-size: 1.4em; flex-shrink: 0; }
        .card-text { flex: 1; min-width: 0; }
        .card-text h3 { margin: 0 0 4px 0; font-size: 0.95em; color: #303133; font-weight: 600; }
        .card-text p { font-size: 0.8em; color: var(--text-light); margin: 0; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .tool-card.placeholder-card { opacity: 0.5; cursor: default; }
        .tool-card.placeholder-card .icon-box { background: #e0e0e0; }
        .no-results { display: none; grid-column: 1 / -1; text-align: center; color: var(--text-light); padding: 60px 20px; }
        .no-results .no-results-icon { font-size: 3em; margin-bottom: 12px; }
        .no-results p { margin: 0; font-size: 0.95em; }
        .footer { flex-shrink: 0; padding: 18px 40px; text-align: center; background: #fff; border-top: 1px solid var(--line); color: var(--text-light); font-size: 0.85em; }
        .footer a { color: var(--primary); text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
        .overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; }

<script src="assets/api-loader.js"></script>
<script>
    const searchInput = document.getElementById('searchInput');
    const toolStats = document.getElementById('toolStats');
    const noResults = document.getElementById('noResults');
    const dynamicContainer = document.getElementById('dynamicTools');

    const loadTools = async () => {
        try {
            const tools = await BoxAPI.getTools({ category: 'document' });
            let html = tools.map(t => BoxAPI.renderToolCard(t)).join('');
            html += `<a href="#" class="tool-card placeholder-card" style="opacity:0.5;">
                <div class="icon-box" style="background:#f0f0f0;">➕</div>
                <div class="card-text"><h3>更多工具</h3><p>更多工具正在开发中...</p></div>
            </a>`;
            dynamicContainer.innerHTML = html;
            bindSearch();
        } catch (e) { console.error('API 加载失败', e); }
    };

    const bindSearch = () => {
        const cards = document.querySelectorAll('#dynamicTools .tool-card:not(.placeholder-card)');
        const total = cards.length;
        toolStats.innerHTML = `共 <strong style="color: #f59e0b;">${total}</strong> 个工具`;

        searchInput.oninput = () => {
            const query = searchInput.value.trim().toLowerCase();
            let visible = 0;
            cards.forEach(card => {
                const title = card.querySelector('h3')?.textContent.toLowerCase() || '';
                const desc = card.querySelector('p')?.textContent.toLowerCase() || '';
                const match = !query || title.includes(query) || desc.includes(query);
                card.classList.toggle('hidden', !match);
                if (match) visible++;
            });
            const ph = document.querySelector('.placeholder-card');
            if (ph) ph.classList.toggle('hidden', !!query);
            noResults.style.display = visible === 0 ? 'block' : 'none';
            toolStats.innerHTML = query
                ? `找到 <strong style="color: #f59e0b;">${visible}</strong> / ${total} 个工具`
                : `共 <strong style="color: #f59e0b;">${total}</strong> 个工具`;
        };
    };

    loadTools();
    initSidebar('document');
</script>
